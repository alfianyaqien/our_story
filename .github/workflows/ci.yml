name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npm run build
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Check for build errors
        run: |
          if [ -d ".next" ]; then
            echo "✓ Build successful - .next directory created"
          else
            echo "✗ Build failed - .next directory not found"
            exit 1
          fi
  
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check formatting (if prettier configured)
        run: |
          if [ -f ".prettierrc" ] || [ -f ".prettierrc.json" ] || [ -f "prettier.config.js" ]; then
            npx prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"
          else
            echo "⚠ Prettier not configured, skipping format check"
          fi
        continue-on-error: true
      
      - name: Check for console.logs (warning only)
        run: |
          if grep -r "console\.log" app/ components/ --include="*.ts" --include="*.tsx" --exclude-dir=node_modules; then
            echo "⚠ Warning: console.log statements found (consider removing for production)"
          else
            echo "✓ No console.log statements found"
          fi
        continue-on-error: true
  
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for vulnerable dependencies
        run: |
          npm audit --json > audit-report.json || true
          if [ -s audit-report.json ]; then
            echo "📊 Security audit completed - check report for details"
            cat audit-report.json
          fi
        continue-on-error: true
