<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2C5AA0;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg1)"/>
  
  <!-- Flowing wave accent -->
  <path d="M35,100 Q55,85 75,95 Q95,105 100,95 Q105,85 125,95 Q145,105 165,100" 
        stroke="white" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Central heart -->
  <path d="M100,75 L85,90 Q75,100 75,115 Q75,130 90,145 L100,155 L110,145 Q125,130 125,115 Q125,100 115,90 Z" 
        fill="white" opacity="0.95"/>
  
  <!-- Decorative small heart accent -->
  <path d="M65,70 C63,70 62,71 62,73 C62,76 65,79 65,79 C65,79 68,76 68,73 C68,71 67,70 65,70 Z" 
        fill="white" opacity="0.6"/>
  
  <!-- Decorative circles for detail -->
  <circle cx="55" cy="90" r="3" fill="white" opacity="0.4"/>
  <circle cx="145" cy="105" r="3" fill="white" opacity="0.4"/>
</svg>
